<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#006400">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Prode 2026">
  <meta name="description" content="Prode Mundial 2026 — ¡A predecir!">
  <title>Prode Mundial 2026</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <header id="app-header" class="hidden">
    <div class="header-bar">
      <div class="header-brand">⚽ <span>Prode 2026</span></div>
      <button id="btn-logout" class="btn-ghost">Salir</button>
    </div>
    <nav id="app-nav">
      <a href="#/partidos"   class="nav-link" data-page="partidos">Partidos</a>
      <a href="#/posiciones" class="nav-link" data-page="posiciones">Posiciones</a>
      <a href="#/perfil"     class="nav-link" data-page="perfil">Mi Perfil</a>
      <a href="#/admin"      class="nav-link" data-page="admin" id="nav-admin-link" style="display:none">Admin</a>
    </nav>
  </header>

  <main id="app-content">
    <div class="loading-screen">
      <div class="spinner"></div>
      <p>Cargando...</p>
    </div>
  </main>

  <div id="toast" class="toast" aria-live="polite"></div>

  <!-- Google Identity Services -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <!-- App scripts -->
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/partidos.js"></script>
  <script src="js/posiciones.js"></script>
  <script src="js/admin.js"></script>
  <script src="js/app.js"></script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('service-worker.js');
      });
    }
  </script>
</body>
</html>
